<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker - Click Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            margin-top: 0;
            color: #4ec9b0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1177bb;
        }
        button.clear {
            background-color: #a31515;
        }
        button.clear:hover {
            background-color: #d32f2f;
        }
        #status {
            color: #888;
            font-size: 14px;
            margin-left: 10px;
        }
        #log-container {
            flex-grow: 1;
            background-color: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
        }
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #333;
            word-break: break-all;
            line-height: 1.4;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .timestamp {
            color: #569cd6;
            margin-right: 8px;
        }
        .target {
            color: #ce9178;
            font-weight: bold;
        }
        .coords {
            color: #b5cea8;
        }
        .url {
            color: #9cdcfe;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Click Monitor (Worker)</h1>
    
    <div class="controls">
        <button id="clearBtn" class="clear">Clear Log</button>
        <button id="exportBtn">Export Log</button>
        <button id="refreshBtn">Refresh</button>
        <span id="status">Total clicks: 0</span>
    </div>

    <div id="log-container">
        <!-- Записи будут появляться здесь -->
    </div>

    <script>
        const logContainer = document.getElementById('log-container');
        const statusEl = document.getElementById('status');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // Функция для отрисовки лога
        function renderLog() {
            const logData = JSON.parse(localStorage.getItem('worker_log_data')) || [];
            
            if (logData.length === 0) {
                logContainer.innerHTML = '<div style="color: #888; text-align: center; margin-top: 20px;">No clicks recorded yet.</div>';
                statusEl.textContent = 'Total clicks: 0';
                return;
            }

            logContainer.innerHTML = '';
            logData.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = `
                    <span class="timestamp">[${entry.time}]</span> 
                    <span class="target">${entry.tagName}</span> 
                    ${entry.id ? '#' + entry.id : ''} 
                    ${entry.className ? '.' + entry.className.split(' ').join('.') : ''}
                    <br><span class="coords">X: ${entry.x}, Y: ${entry.y}</span>
                    <br><span class="url">URL: ${entry.url}</span>
                    ${entry.text ? '<br>Text: "' + entry.text.substring(0, 50) + (entry.text.length > 50 ? '...' : '') + '"' : ''}
                `;
                logContainer.appendChild(div);
            });
            logContainer.scrollTop = logContainer.scrollHeight;
            statusEl.textContent = `Total clicks: ${logData.length}`;
        }

        // Первоначальная отрисовка
        renderLog();

        // Обновление лога в реальном времени
        window.addEventListener('storage', function(e) {
            if (e.key === 'worker_log_data') {
                renderLog();
            }
        });

        // Кнопка обновления (на случай, если storage event не сработал)
        refreshBtn.addEventListener('click', () => {
            renderLog();
            statusEl.textContent = 'Log refreshed.';
            statusEl.style.color = '#4ec9b0';
        });

        // Очистка лога
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear the log?')) {
                localStorage.setItem('worker_log_data', JSON.stringify([]));
                renderLog();
                statusEl.textContent = 'Log cleared.';
                statusEl.style.color = '#4ec9b0';
            }
        });

        // Экспорт лога
        exportBtn.addEventListener('click', () => {
            const logData = JSON.parse(localStorage.getItem('worker_log_data')) || [];
            if (logData.length === 0) {
                alert('Log is empty.');
                return;
            }
            const dataStr = JSON.stringify(logData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'click_log_' + new Date().toISOString().slice(0,19).replace(/:/g, '-') + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
